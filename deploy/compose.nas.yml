# NAS 에서 도는 모습 — **여기서 만들어 보낸 이미지**를 그대로 쓴다.
#
# 이 파일에는 build: 가 없다. NAS 는 만들지 않고 받아서 돌리기만 한다.
# 그래서 NAS 에 소스도 git 도 필요 없고, 여기서 시험한 그 이미지가
# 글자 하나 다르지 않게 NAS 에서 돈다.
#
# nas-deploy.bat 이 이 파일을 이미지와 함께 실어 보낸다.
#
# **홈페이지는 여기 없다.** 아우라버스 홈페이지는 제 저장소(aurabus-site)에서
# 제 손으로 배포된다 — 같은 NAS 에 있을 뿐 서로 아무것도 공유하지 않는다.
# 둘을 한 compose 에 묶으면 한쪽을 올릴 때 다른 쪽까지 흔들린다.

name: aurabus

services:

  majung:
    image: majung:latest
    container_name: majung
    restart: unless-stopped
    user: "${MAJUNG_UID:-1000}:${MAJUNG_GID:-1000}"
    # 시놀로지 공유 폴더는 ACL 로 지켜진다. 폴더가 1027:100 소유에 777 로 보여도
    # 컨테이너 안의 1027 은 못 쓴다 — ACL 이 administrators 그룹에만 쓰기를 주기
    # 때문이다. 그 그룹을 하나 더 달아 주면 열린다. (nas-run.sh 가 값을 채운다)
    group_add:
      - "${MAJUNG_EXTRA_GID:-100}"
    environment:
      MAJUNG_SECRET: "${MAJUNG_SECRET:?.env 에 MAJUNG_SECRET 이 없습니다}"
      MAJUNG_PUBLIC_URL: "${MAJUNG_PUBLIC_URL:-}"
      MAJUNG_PROXY_HOPS: "${MAJUNG_PROXY_HOPS:-1}"
      MAJUNG_SKIN: "${MAJUNG_SKIN:-}"
      TZ: "Asia/Seoul"
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8765:8000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
