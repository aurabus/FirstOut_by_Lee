# 홈페이지를 내어주는 규칙 (site 컨테이너 안의 nginx).
#
# docker-compose.yml 이 이 파일을 컨테이너의 /etc/nginx/conf.d/default.conf 로 붙인다.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # 이 홈페이지는 첫 화면이 index.html 이 아니라 **main.html** 이다.
    # 맥의 아파치가 그렇게 내주고 있었다 (/ 로 들어가면 main.html 이 열린다).
    # index.html 이 있으면 그것을, 없으면 main.html 을 연다.
    index index.html main.html;

    # 맥에서 파일을 옮겨오면 ._이름 꼴의 찌꺼기가 딸려온다. 내어주지 않는다.
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 그림·글꼴·스타일은 한 번 받으면 한동안 다시 안 받게 한다.
    # 사무실 회선으로 내보내는 것이라 이 한 줄이 체감을 꽤 바꾼다.
    location ~* \.(png|jpe?g|gif|svg|webp|ico|woff2?|ttf|css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
