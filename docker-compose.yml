# NAS 한 대에서 홈페이지와 손잡고 마중을 함께 돌린다.
#
#   site    아우라버스 홈페이지 (정적 HTML)
#   majung  손잡고 마중
#
# 바깥에서 들어오는 손님은 **DSM 의 역방향 프록시**가 받아서 주소에 따라
# 이 둘 중 하나로 넘겨준다. 인증서도 DSM 이 발급하고 갱신한다.
# 중간에 남의 회사를 거치지 않으므로 오가는 내용을 우리만 본다.
#
#   www.aurabus.com     →  localhost:8080  (site)
#   aurabus.com         →  localhost:8080  (site)
#   majung.aurabus.com  →  localhost:8765  (majung)
#
# 두 컨테이너 모두 127.0.0.1 에만 문을 연다. NAS 밖에서는 직접 닿지 못하고
# 반드시 DSM 역방향 프록시를 거쳐야 한다.
#
# 비밀 값은 이 파일에 적지 않는다. 같은 폴더의 .env 에 두고 여기서 읽어 간다.
# (.env 는 .gitignore 로 막혀 있어 저장소에 올라가지 않는다)

services:

  # ── 홈페이지 ────────────────────────────────────────────────
  # 정적 HTML 이라 그냥 내어주기만 하면 된다. 고칠 것이 생기면
  # site/ 폴더의 파일을 바꾸면 끝이다 — 다시 띄울 필요도 없다.
  site:
    image: nginx:alpine
    container_name: aurabus-site
    restart: unless-stopped
    volumes:
      # :ro 는 read only — 컨테이너가 홈페이지 파일을 고치지 못하게 한다
      - ./site:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8080:80"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── 손잡고 마중 ─────────────────────────────────────────────
  majung:
    build:
      context: .
      args:
        # 자료 폴더의 주인 번호. NAS 에서 `id` 로 확인한 값을 넣는다.
        UID: "${MAJUNG_UID:-1000}"
        GID: "${MAJUNG_GID:-1000}"
    image: majung:latest
    container_name: majung
    restart: unless-stopped

    environment:
      # 세션 서명 키 — 이 값을 아는 사람은 남의 로그인을 만들어낼 수 있다
      MAJUNG_SECRET: "${MAJUNG_SECRET:?.env 에 MAJUNG_SECRET 을 넣어주세요}"
      # 밖에서 접속하는 주소. 초대 QR 과 링크가 이 주소로 만들어진다
      MAJUNG_PUBLIC_URL: "${MAJUNG_PUBLIC_URL:-}"
      # 앞에 우리가 세운 프록시가 몇 대인가.
      # DSM 역방향 프록시 한 대를 거치므로 1 이다.
      # 0 이면 감사 로그의 접속지가 전부 NAS 주소로 뭉갠다.
      MAJUNG_PROXY_HOPS: "${MAJUNG_PROXY_HOPS:-1}"
      MAJUNG_SKIN: "${MAJUNG_SKIN:-}"
      TZ: "Asia/Seoul"

    volumes:
      # 원아 자료·서명·백업이 모두 여기 쌓인다. 이 폴더만 지키면 된다.
      - ./data:/data

    ports:
      - "127.0.0.1:8765:8000"

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
