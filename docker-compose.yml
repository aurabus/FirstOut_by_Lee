# 손잡고 마중 — 시놀로지 NAS 에서 도는 모습.
#
#     docker compose up -d --build
#
# 바깥 손님은 **DSM 의 역방향 프록시**가 받아서 여기로 넘겨준다.
#     majung.aurabus.com  →  localhost:8765
# 인증서도 DSM 이 발급하고 갱신한다. 중간에 남의 회사를 거치지 않으므로
# 오가는 내용(원아 이름·보호자 연락처)을 우리만 본다.
#
# 아우라버스 홈페이지는 **다른 저장소**(aurabus-site)에서 따로 돈다.
# 같은 NAS 에 있지만 서로 아무것도 공유하지 않는다.
#
# 비밀 값은 이 파일에 적지 않는다. 같은 폴더의 .env 에 두고 여기서 읽어 간다.

services:

  # ── 손잡고 마중 ─────────────────────────────────────────────
  majung:
    build: .
    image: majung:latest
    container_name: majung
    restart: unless-stopped

    # 누구로 돌릴지는 **띄울 때** 정한다 — 이미지를 다시 만들 필요가 없다.
    # NAS 에서 `id` 로 확인한 번호를 .env 에 적는다 (예: 1026:100).
    # 이 번호가 자료 폴더(data/)의 주인과 달라야 할 이유는 없다.
    user: "${MAJUNG_UID:-1000}:${MAJUNG_GID:-1000}"

    environment:
      # 세션 서명 키 — 이 값을 아는 사람은 남의 로그인을 만들어낼 수 있다
      MAJUNG_SECRET: "${MAJUNG_SECRET:?.env 에 MAJUNG_SECRET 을 넣어주세요}"
      # 밖에서 접속하는 주소. 초대 QR 과 링크가 이 주소로 만들어진다
      MAJUNG_PUBLIC_URL: "${MAJUNG_PUBLIC_URL:-}"
      # 앞에 우리가 세운 프록시가 몇 대인가.
      # DSM 역방향 프록시 한 대를 거치므로 1 이다.
      # 0 이면 감사 로그의 접속지가 전부 NAS 주소로 뭉갠다.
      MAJUNG_PROXY_HOPS: "${MAJUNG_PROXY_HOPS:-1}"
      MAJUNG_SKIN: "${MAJUNG_SKIN:-}"
      TZ: "Asia/Seoul"

    volumes:
      # 원아 자료·서명·백업이 모두 여기 쌓인다. 이 폴더만 지키면 된다.
      - ./data:/data

    ports:
      - "127.0.0.1:8765:8000"

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
