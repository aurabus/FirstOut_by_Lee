# 손잡고 마중 — Container Manager 「프로젝트」로 그대로 올린다.
#
# 비밀 값은 여기 적지 않는다. 같은 폴더의 .env 에 두고 이 파일이 읽어 간다.
# (.env 는 .gitignore 로 막혀 있다 — 저장소에 올라가지 않는다)

services:
  majung:
    build:
      context: .
      args:
        # 자료 폴더의 주인 번호. DSM 에서 만든 폴더 주인과 맞춰야 쓰기가 된다.
        UID: "${MAJUNG_UID:-1000}"
        GID: "${MAJUNG_GID:-1000}"
    image: majung:latest
    container_name: majung
    restart: unless-stopped

    environment:
      # 세션 서명 키 — 이 값을 아는 사람은 남의 로그인을 만들어낼 수 있다
      MAJUNG_SECRET: "${MAJUNG_SECRET:?.env 에 MAJUNG_SECRET 을 넣어주세요}"
      # 밖에서 접속하는 주소. QR·초대 링크가 이 주소로 만들어진다
      MAJUNG_PUBLIC_URL: "${MAJUNG_PUBLIC_URL:-}"
      # 앞에 우리가 세운 프록시가 몇 대인가. DSM 역방향 프록시 한 대면 1.
      # 0 이면 접속지 헤더를 아예 믿지 않는다 (감사 로그·속도 제한이 프록시 주소로 뭉갠다)
      MAJUNG_PROXY_HOPS: "${MAJUNG_PROXY_HOPS:-1}"
      MAJUNG_SKIN: "${MAJUNG_SKIN:-}"
      TZ: "Asia/Seoul"

    volumes:
      # 원아 자료·서명·백업이 모두 여기 쌓인다. 이 폴더만 지키면 된다.
      - ./data:/data

    ports:
      # 바깥에는 열지 않는다 — DSM 역방향 프록시만 이 문으로 들어온다.
      # 127.0.0.1 을 떼면 NAS 의 다른 포트로 그대로 노출되니 그대로 두는 것이 좋다.
      - "127.0.0.1:8765:8000"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
