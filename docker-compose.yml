# NAS 한 대에서 홈페이지와 손잡고 마중을 함께 돌린다.
#
#   site    아우라버스 홈페이지 (정적 HTML)
#   majung  손잡고 마중
#   tunnel  바깥과 이어주는 유일한 통로 (Cloudflare Tunnel)
#
# 공유기에 구멍을 뚫지 않는다. NAS 가 바깥으로 걸어 나가는 연결 하나만 쓴다.
# 그래서 학교에서 받은 고정 IP 가 바뀌어도, 회선이 바뀌어도 그대로 돈다.
#
# 비밀 값은 이 파일에 적지 않는다. 같은 폴더의 .env 에 두고 여기서 읽어 간다.
# (.env 는 .gitignore 로 막혀 있어 저장소에 올라가지 않는다)

services:

  # ── 홈페이지 ────────────────────────────────────────────────
  # 정적 HTML 이라 그냥 내어주기만 하면 된다. 고칠 것이 생기면
  # site/ 폴더의 파일을 바꾸고 새로고침하면 끝이다 — 다시 띄울 필요도 없다.
  site:
    image: nginx:alpine
    container_name: aurabus-site
    restart: unless-stopped
    volumes:
      # :ro 는 read only — 컨테이너가 홈페이지 파일을 고치지 못하게 한다
      - ./site:/usr/share/nginx/html:ro
    ports:
      # NAS 안에서만 열린다. 밖에서는 터널을 거쳐야 닿는다.
      # 터널을 켜기 전에 http://NAS주소:8080 으로 미리 확인할 때 쓴다.
      - "127.0.0.1:8080:80"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── 손잡고 마중 ─────────────────────────────────────────────
  majung:
    build:
      context: .
      args:
        # 자료 폴더의 주인 번호. NAS 에서 `id 사용자이름` 으로 확인한 값을 넣는다.
        UID: "${MAJUNG_UID:-1000}"
        GID: "${MAJUNG_GID:-1000}"
    image: majung:latest
    container_name: majung
    restart: unless-stopped

    environment:
      # 세션 서명 키 — 이 값을 아는 사람은 남의 로그인을 만들어낼 수 있다
      MAJUNG_SECRET: "${MAJUNG_SECRET:?.env 에 MAJUNG_SECRET 을 넣어주세요}"
      # 밖에서 접속하는 주소. 초대 QR 과 링크가 이 주소로 만들어진다
      MAJUNG_PUBLIC_URL: "${MAJUNG_PUBLIC_URL:-}"
      # 앞에 우리가 세운 프록시가 몇 대인가.
      # Cloudflare Tunnel 을 거치면 1 이다 — 맨 오른쪽 값이 진짜 접속자 주소다.
      # 0 이면 감사 로그의 접속지가 전부 터널 주소로 뭉갠다.
      MAJUNG_PROXY_HOPS: "${MAJUNG_PROXY_HOPS:-1}"
      MAJUNG_SKIN: "${MAJUNG_SKIN:-}"
      TZ: "Asia/Seoul"

    volumes:
      # 원아 자료·서명·백업이 모두 여기 쌓인다. 이 폴더만 지키면 된다.
      - ./data:/data

    ports:
      # 여기도 NAS 안에서만. 터널 켜기 전 확인용이다.
      - "127.0.0.1:8765:8000"

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ── 바깥과 이어주는 통로 ────────────────────────────────────
  # 이 컨테이너가 Cloudflare 로 연결을 걸어 나간다. 들어오는 구멍이 없으므로
  # 공유기 포트포워딩이 필요 없고, 사무실 IP 도 밖에 드러나지 않는다.
  #
  # 어느 주소를 어디로 보낼지는 Cloudflare 화면에서 정한다 (deploy/README.md 8장).
  #   www.aurabus.com    → http://site:80
  #   majung.aurabus.com → http://majung:8000
  # 컨테이너끼리는 이름으로 통하므로 NAS 안에서도 포트를 열 필요가 없다.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: aurabus-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CF_TUNNEL_TOKEN:?.env 에 CF_TUNNEL_TOKEN 을 넣어주세요}"
    depends_on: [site, majung]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
