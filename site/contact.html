<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문의하기 | AURABUS</title>

  <link rel="stylesheet" href="css/contact.css" />
  <link rel="stylesheet" href="css/style.css" />
 <!-- ✅ 헤더 로더 (최적화 버전) -->
  <script src="js/header_fast.js" defer></script>
</head>
<body class="sub-page">

  <!-- ✅ 공통 헤더 include -->
  <div id="header-container"></div>

  <!-- ✅ Hero Section -->
<section class="sub-hero contact-hero">
  <div class="hero-content-main">
    <h1>문의하기</h1>
    <p>AI 서비스 및 협업 관련 문의는 아래 연락처를 이용해주세요.</p>
  </div>
</section>

  <!-- ✅ Contact Section -->
  <section class="contact-section">
    <div class="contact-container">
      <div class="contact-image">
        <img src="images/contact_img.png" alt="Contact Illustration" />
      </div>

      <div class="contact-info">
        <h2>기술 협력 문의</h2>

        <ul class="contact-list">
          <li><strong>043-724-0211</strong></li>
          <li>이메일 : aurabus@aurabus.com</li>
          <li>월~금 10:00 ~ 16:00 (공휴일 제외)</li>
        </ul>

        <p class="contact-note">
          ※ 기술 협력, 공동 연구 제안 및 AI 솔루션 도입 문의는 이메일로 접수받고 있습니다.
        </p>
      </div>
    </div>
  </section>

  <!-- ✅ Footer -->
  <div id="footer-placeholder"></div>
<script>
  fetch("footer.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("footer-placeholder").innerHTML = html;
    });
</script>

  <!-- ✅ Scroll Animation -->
  <script>
    const contactSection = document.querySelector(".contact-container");
    const contactImage = document.querySelector(".contact-image");
    const contactInfo = document.querySelector(".contact-info");

    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            contactSection.classList.add("visible");
            contactImage.classList.add("visible");
            contactInfo.classList.add("visible");
            observer.disconnect();
          }
        });
      },
      { threshold: 0.2 }
    );

    observer.observe(contactSection);
  </script>
</body>
</html>
