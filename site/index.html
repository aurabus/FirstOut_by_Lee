<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>준비 중 · 아우라버스</title>
  <style>
    :root{color-scheme:light}
    body{margin:0;min-height:100vh;display:grid;place-items:center;
      background:#F3F6F4;color:#16211D;
      font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif}
    .box{max-width:30rem;padding:2rem;text-align:center;background:#fff;
      border:1px solid #DCE5E0;border-radius:14px;
      box-shadow:0 1px 3px rgba(20,32,28,.06),0 6px 18px rgba(20,32,28,.07)}
    h1{margin:0 0 .5rem;font-size:1.25rem;font-weight:700}
    p{margin:.4rem 0;font-size:.92rem;color:#4A5A54;line-height:1.6}
    code{background:#E9EFEB;border-radius:6px;padding:.1rem .35rem;font-size:.86rem}
  </style>
</head>
<body>
  <div class="box">
    <h1>홈페이지 파일이 아직 없습니다</h1>
    <p>이 화면이 보인다면 자리는 제대로 잡힌 것입니다.
       <code>site/</code> 폴더에 홈페이지 파일을 넣고 새로고침하세요.</p>
    <p>무엇을 가져와야 하는지는 <code>site/README.md</code> 에 적어두었습니다.</p>
  </div>
</body>
</html>
