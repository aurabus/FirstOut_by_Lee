<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공지사항 | AURABUS</title>

  <link rel="stylesheet" href="css/notice.css" />
  <link rel="stylesheet" href="css/style.css" />
 <!-- ✅ 헤더 로더 (최적화 버전) -->
  <script src="js/header_fast.js" defer></script>
</head>
<body class="sub-page">

 <!-- ✅ 여기에 공통 헤더 include 코드 -->
<div id="header-container"></div>

  <!-- 히어로 -->
<section class="sub-hero notice-hero">
  <div class="hero-content-main">
    <h1>공지사항</h1>
    <p>새로운 소식과 안내를 확인하세요</p>
  </div>
</section>

  <!-- 공지 목록 -->
  <section class="notice-section">

    <!-- 필터 + 검색 -->
    <div class="notice-controls">
      <div class="notice-category">
         <!-- <button data-category="전체">전체</button> -->
       <button class="active" data-category="공지">공지</button>
         <!-- <button data-category="업데이트">업데이트</button> -->
         <!-- <button data-category="점검">점검</button> -->
      </div>
      <input type="text" id="notice-search" placeholder="공지 검색..." />
    </div>

    <!-- 테이블 -->
    <div class="notice-table-wrap">
      <table class="notice-table" id="notice-table">
        <thead>
          <tr>
            <th style="width:70px">번호</th>
            <th>제목</th>
            <th style="width:110px">분류</th>
            <th style="width:120px">작성일</th>
          </tr>
        </thead>
        <tbody id="notice-list">
          <!-- js/notice.js 에서 채움 -->
        </tbody>
      </table>
    </div>

    <!-- 페이지네이션 -->
    <div id="notice-pagination" class="notice-pagination"></div>
  </section>

  <!-- ✅ Footer -->
  <div id="footer-placeholder"></div>
<script>
  fetch("footer.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("footer-placeholder").innerHTML = html;
    });
</script>

  <!-- 공지 전용 스크립트 -->
<script src="js/notice.js"></script>

</body>
</html>
