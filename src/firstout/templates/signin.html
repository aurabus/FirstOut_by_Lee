{% extends "base.html" %}
{% block title %}로그인 · {{ app_name }}{% endblock %}
{% block body %}
<div class="login">
  <form class="login-card" method="post" action="/signin">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <div>
      <span class="lb-1">손잡고</span>
      <span class="lb-2">마중</span>
    </div>
    <div class="login-mark"></div>
    <p class="login-sub">{{ tagline }}<em>유치원 귀가 관리</em></p>

    {% if error %}<p class="login-err">{{ error }}</p>{% endif %}
    {% if msg %}<p class="msg" style="margin:.2rem 0">{{ msg }}</p>{% endif %}

    <label class="login-lbl" for="lid">아이디</label>
    <input class="field" id="lid" name="login_id" autocomplete="username"
           autocapitalize="off" autocorrect="off" required style="width:100%">

    <label class="login-lbl" for="pw">비밀번호</label>
    <input class="field" id="pw" name="password" type="password"
           autocomplete="current-password" required style="width:100%">

    <div class="dev">
      <label class="dev-opt">
        <input type="radio" name="device" value="personal" checked>
        <span><b>내 휴대폰이에요</b><em>60일 동안 로그인이 유지됩니다</em></span>
      </label>
      <label class="dev-opt">
        <input type="radio" name="device" value="shared">
        <span><b>공용 기기예요</b><em>12시간 뒤 자동으로 로그아웃됩니다</em></span>
      </label>
    </div>

    <button class="btn go" style="margin-top:.6rem">로그인</button>
    <p class="login-hint">
      비밀번호를 잊으셨으면 <b>총괄 관리자</b>께 재발급을 요청해 주세요.
    </p>
  </form>
</div>

<p style="text-align:center;margin-top:-1.5rem;padding-bottom:2rem;font-size:.85rem;color:var(--ink-3)">
  유치원을 새로 등록하시나요? <a href="/signup">가입 신청</a>
</p>
{% endblock %}
